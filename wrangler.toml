# traces.flisk.si: Flisk Workers send a row only when a request went wrong or took an unexpected path.
name = "flisk-traces"
main = "src/index.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "traces.flisk.si", custom_domain = true }]

# No cron: the free plan allows 5 cron triggers per account and they are used. Old rows are deleted from ingest, at most once an hour.

# The account is at its D1 limit, so the traces table lives inside the flisk-jobs database (its own table, no clash).
#   bunx wrangler@4 d1 execute flisk-jobs --remote --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "flisk-jobs"
database_id = "748475e4-c4d7-4d15-a4fb-688ef63e9da0"

# Reading the page: sign in with GitHub through login.flisk.si. Only the logins in ADMIN_LOGINS may read.
[vars]
LOGIN_PUBLIC_KEY = "g_3cGlqaMDf4mM4Bgfv8EO6js7yW_bcSW7cOUpSwLc0"  # public half of the login Worker's key, not secret
ADMIN_LOGINS = "odykyi"

# Secrets: TRACE_KEYS (comma list "chat:<key>,inference:<key>", one key per app), SESSION_SECRET (signs the cookie),
# ADMIN_KEY (optional: lets scripts read /api/events with a Bearer key).
